description = "Mercury 3:2 spin-orbit resonant capture: two-body Sun-Mercury, Hut (1981) constant-time-lag tides + permanent-triaxiality torque, integrated with the vendored pure-Rust SUNDIALS 7.8.0 CVODE (BDF + Newton + dense)."

[dependencies]
